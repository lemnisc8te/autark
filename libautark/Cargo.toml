[package]
name = "libautark"
version = "0.1.0"
edition = "2024"

[dependencies]
anyhow = "1.0.103"
arc-swap = "1.9.2"
assert_no_alloc = "1.1.2"
async-trait = "0.1.91"
audioadapter-buffers = "4.0.0"
cpal = "0.18.1"
dyn-clone = "1.0.20"
flume = "0.12.0"
rayon = "1.12.0"
rtrb = "0.3.4"
rubato = "4.0.0"
serde = {version = "1.0.228", features = ["derive"]}
slotmap = {version = "1.1.1", features = ["serde"]}
symphonia = {version = "0.6.0", features = ["mp3"]}
thiserror = "2.0.18"
tokio = { version = "1.53.1", features = ["rt", "sync"] }

